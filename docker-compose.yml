version: '3.9'

services:

  app:
    build: .
    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - postgres

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: scraping_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres9767

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: